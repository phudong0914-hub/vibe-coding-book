<script id="custom-cursor-script">
  // Custom Cursor Follower (Nguyen Xuan Tai style)
  if (window.innerWidth > 1024) {
    let dot = null;
    let follower = null;
    let mouseX = 0;
    let mouseY = 0;
    let followerX = 0;
    let followerY = 0;

    const checkAndCreateCursor = () => {
      dot = document.getElementById('custom-cursor-dot');
      follower = document.getElementById('custom-cursor-follower');
      if (!dot) {
        dot = document.createElement('div');
        dot.id = 'custom-cursor-dot';
        document.body.appendChild(dot);
      }
      if (!follower) {
        follower = document.createElement('div');
        follower.id = 'custom-cursor-follower';
        document.body.appendChild(follower);
      }
    };
    checkAndCreateCursor();
    setInterval(checkAndCreateCursor, 1000);

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (dot) {
        dot.style.left = mouseX + 'px';
        dot.style.top = mouseY + 'px';
      }
    });

    function animateFollower() {
      if (follower) {
        const dx = mouseX - followerX;
        const dy = mouseY - followerY;
        followerX += dx * 0.15;
        followerY += dy * 0.15;
        follower.style.left = followerX + 'px';
        follower.style.top = followerY + 'px';
      }
      requestAnimationFrame(animateFollower);
    }
    requestAnimationFrame(animateFollower);

    // Dynamic hover scaling on hoverable elements
    const attachHoverEvents = () => {
      document.querySelectorAll('a, button, input, select, textarea, [role="button"], .reader_tocTrigger__kx6Zs, .reader_darkToggle__fe_JD, .reader_railSection__fR9f4, .reader_chapterLink__oN1gG').forEach(el => {
        if (!el.dataset.hasCursorEvents) {
          el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
          el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
          el.dataset.hasCursorEvents = 'true';
        }
      });
    };
    attachHoverEvents();
    setInterval(attachHoverEvents, 1000);
  }
</script>
